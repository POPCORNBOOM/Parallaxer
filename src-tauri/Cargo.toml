[package]
name = "parallaxer"
version = "0.1.0"
edition = "2024"

[package.metadata]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
dirs = "6"

[target.'cfg(windows)'.dependencies]
wmi = "0.14"
